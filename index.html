<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>依赖工作室校园服务网</title>
<style>
:root{
  --bg:#0a0e17; --txt:#e6e8f0; --txt-dim:#8b93a7;
  --glass:rgba(255,255,255,.05); --glass-line:rgba(255,255,255,.10);
  --accent:#00e0ff; --accent2:#7c5cff; --accent3:#ff7a8a; --accent4:#39e6a0; --gold:#ffcf3f;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{background:var(--bg);color:var(--txt)}
body{font-family:"PingFang SC","Microsoft YaHei","Segoe UI",system-ui,sans-serif;min-height:100vh;overflow-x:hidden}
a{color:inherit}

/* 极光背景 */
.aurora{position:fixed;inset:0;z-index:-2;overflow:hidden}
.aurora i{position:absolute;border-radius:50%;filter:blur(90px);opacity:.5}
.aurora i:nth-child(1){width:52vw;height:52vw;background:#7c5cff;top:-18vw;left:-10vw}
.aurora i:nth-child(2){width:46vw;height:46vw;background:#00e0ff;bottom:-16vw;right:-8vw}
.aurora i:nth-child(3){width:34vw;height:34vw;background:#ff5cae;top:38%;left:55%;opacity:.28}
.aurora i:nth-child(4){width:28vw;height:28vw;background:#ffcf3f;bottom:30%;left:12%;opacity:.16}
.grid-bg{position:fixed;inset:0;z-index:-1;pointer-events:none;
  background-image:linear-gradient(rgba(255,255,255,.035) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.035) 1px,transparent 1px);
  background-size:64px 64px;mask-image:radial-gradient(circle at 50% 30%,#000,transparent 85%)}

/* 顶栏 */
header{position:sticky;top:0;z-index:50;backdrop-filter:blur(14px);background:rgba(10,14,23,.72);border-bottom:1px solid var(--glass-line)}
.hwrap{max-width:1440px;margin:0 auto;padding:14px 28px 0}
.brandrow{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.logo{width:42px;height:42px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:16px;letter-spacing:.5px;
  background:linear-gradient(135deg,#00e0ff,#7c5cff,#ff5cae);color:#0a0e17;box-shadow:0 6px 18px rgba(124,92,255,.4)}
.brand h1{font-size:17px;font-weight:800;letter-spacing:.3px}
.brand p{font-size:12px;color:var(--txt-dim)}
.badge{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
.chip{padding:5px 11px;border-radius:999px;font-size:11.5px;color:var(--txt-dim);background:var(--glass);border:1px solid var(--glass-line);display:flex;align-items:center;gap:6px}
.chip b{color:var(--txt)}
.dot{width:7px;height:7px;border-radius:50%;background:#39e6a0;box-shadow:0 0 10px #39e6a0;animation:pulse 1.8s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}

/* 9 类目横向导航 */
.nav{display:flex;gap:9px;overflow-x:auto;padding:12px 0 12px;scrollbar-width:none}
.nav::-webkit-scrollbar{display:none}
.nav button{border:1px solid var(--glass-line);background:var(--glass);color:var(--txt-dim);padding:8px 15px;border-radius:999px;
  font-size:13.5px;font-weight:600;cursor:pointer;white-space:nowrap;transition:.25s;backdrop-filter:blur(6px)}
.nav button:hover{color:#fff;border-color:rgba(0,224,255,.5)}
.nav button.on{color:#0a0e17;background:linear-gradient(90deg,#00e0ff,#7c5cff);border-color:transparent;box-shadow:0 6px 18px rgba(0,224,255,.35)}
.nav button .n{opacity:.6;font-size:11px;margin-left:3px}

main{max-width:1440px;margin:0 auto;padding:26px 28px 70px}
.panel{animation:fade .35s ease}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.hero{display:flex;align-items:flex-end;justify-content:space-between;gap:14px;flex-wrap:wrap;margin-bottom:16px}
.hero h2{font-size:26px;font-weight:900;letter-spacing:.5px;display:flex;align-items:center;gap:9px}
.hero h2 em{font-style:normal;font-size:13px;color:var(--txt-dim);font-weight:600;margin-left:4px}
.hero p{font-size:13.5px;color:var(--txt-dim);line-height:1.75;max-width:820px;margin-top:6px}
.hero p b{color:#fff}.hero p em{color:var(--gold);font-style:normal;font-weight:700}

.tools{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:18px}
.search{flex:1;min-width:240px;position:relative;display:flex;align-items:center;gap:9px;padding:9px 13px;border-radius:13px;
  background:var(--glass);border:1px solid var(--glass-line)}
.search input{flex:1;border:none;background:transparent;color:var(--txt);font-size:13.5px;outline:none;width:100%}
.search input::placeholder{color:#6d7590}
.clear{cursor:pointer;font-size:12px;color:var(--txt-dim);display:none}
.search.has .clear{display:block}
.act{display:flex;gap:8px}
.act button{padding:9px 14px;border-radius:11px;border:1px solid var(--glass-line);background:var(--glass);color:var(--txt-dim);
  font-size:13px;font-weight:600;cursor:pointer;transition:.2s}
.act button.on{color:#0a0e17;background:linear-gradient(90deg,#ffcf3f,#ff9a3f);border-color:transparent}
.act button:hover{color:#fff}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(152px,1fr));gap:14px}
.card{position:relative;min-height:110px;padding:16px 14px 14px;border-radius:16px;background:var(--glass);border:1px solid var(--glass-line);
  display:flex;flex-direction:column;align-items:center;text-align:center;cursor:pointer;transition:.28s;backdrop-filter:blur(8px);overflow:hidden}
.card::before{content:"";position:absolute;top:-40%;left:-40%;width:180%;height:180%;background:radial-gradient(circle,var(--c),transparent 62%);opacity:.18;transition:.3s}
.card:hover{transform:translateY(-5px);border-color:var(--c);box-shadow:0 12px 30px color-mix(in srgb,var(--c) 38%,transparent)}
.card:hover::before{opacity:.34}
.card .av{position:relative;width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:800;color:#0a0e17;
  background:linear-gradient(135deg,var(--c),color-mix(in srgb,var(--c) 30%,#fff));margin-bottom:9px;z-index:1}
.card .nm{position:relative;font-size:13.5px;font-weight:700;line-height:1.3;z-index:1}
.card .tg{position:relative;margin-top:7px;font-size:10.5px;padding:2px 8px;border-radius:999px;z-index:1;
  background:color-mix(in srgb,var(--c) 22%,transparent);color:var(--c);border:1px solid color-mix(in srgb,var(--c) 40%,transparent)}
.empty{grid-column:1/-1;text-align:center;padding:40px 20px;color:var(--txt-dim);font-size:14px;background:var(--glass);border:1px dashed var(--glass-line);border-radius:16px}
.empty b{display:block;color:#fff;margin-bottom:4px}

/* ============ 通用任务单 ============ */
.signin{display:flex;flex-direction:column;gap:16px}
.si-hero{position:relative;overflow:hidden;padding:22px 24px;border-radius:20px;background:linear-gradient(135deg,rgba(255,140,80,.16),rgba(255,80,130,.10) 60%,rgba(124,92,255,.10));
  border:1px solid rgba(255,140,80,.28);display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}
.si-halo{position:absolute;inset:0;background:radial-gradient(circle at 30% 20%,rgba(255,120,80,.5),transparent 60%),radial-gradient(circle at 80% 70%,rgba(255,80,140,.4),transparent 60%)}
.si-txt{position:relative}
.si-eyebrow{font-size:12px;letter-spacing:1.2px;color:#ffb088;font-weight:700}
.si-txt h3{font-size:23px;margin:6px 0 6px;background:linear-gradient(90deg,#ffb088,#ff5c8a);-webkit-background-clip:text;background-clip:text;color:transparent}
.si-txt p{font-size:13.5px;color:var(--txt-dim);line-height:1.75}
.si-txt em{color:#ffcf3f;font-style:normal;font-weight:700}
.si-chips{position:relative;display:flex;flex-wrap:wrap;gap:8px}
.si-chips span,.si-chips.cq-c span{font-size:12.5px;padding:6px 12px;border-radius:999px;background:rgba(255,120,90,.13);border:1px solid rgba(255,120,90,.3);color:#ffc2a8}
.si-chips span{background:rgba(0,224,255,.12);border-color:rgba(0,224,255,.3);color:#8eeaff}
.si-card{position:relative;padding:20px;border-radius:18px;background:rgba(255,255,255,.045);border:1px solid var(--glass-line);backdrop-filter:blur(10px)}
.si-bar{display:flex;align-items:center;gap:7px;margin-bottom:16px}
.si-bar i{width:10px;height:10px;border-radius:50%;background:#ff6b6b}
.si-bar i:nth-child(2){background:#ffcf3f}.si-bar i:nth-child(3){background:#39e6a0}
.si-bar b{margin-left:6px;font-size:13.5px;letter-spacing:.5px;color:#ffb088}
.si-bar em{margin-left:auto;font-size:12px;font-style:normal;color:var(--txt-dim)}
.si-grid{display:grid;grid-template-columns:1fr 1fr;gap:13px}
.si-f{display:flex;flex-direction:column;gap:5px}
.si-f.wide{grid-column:1/-1}
.si-f label{font-size:12.5px;color:var(--txt-dim)}
.si-f label span{color:#ff7a8a;margin-left:2px}
.si-in,.mj-in{width:100%;padding:11px 13px;border-radius:11px;border:1px solid rgba(255,255,255,.14);background:rgba(0,0,0,.26);color:#fff;font-size:13.5px;outline:none;transition:.25s}
.si-in:focus,.mj-in:focus{border-color:#ff9a5a;box-shadow:0 0 0 3px rgba(255,140,80,.22)}
.si-up{position:relative;border:2px dashed rgba(255,140,80,.4);border-radius:12px;padding:22px;text-align:center;cursor:pointer;background:rgba(0,0,0,.18);transition:.25s}
.si-up:hover{border-color:#ff9a5a;background:rgba(255,140,80,.06)}
.si-up.ok{border-style:solid;border-color:#39e6a0;background:rgba(57,230,160,.08)}
.si-up input{position:absolute;inset:0;opacity:0;cursor:pointer}
.si-ico{font-size:22px;display:block}
.si-up b{display:block;font-size:13.5px;margin:4px 0 2px}.si-up small{font-size:11.5px;color:var(--txt-dim)}
.si-foot,.mj-foot{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;margin-top:18px}
.si-meta,.mj-meta{font-size:12px;color:var(--txt-dim)}.si-meta b,.mj-meta b{color:#ffb088}
.si-btn,.mj-btn{flex:1;min-width:220px;padding:13px 20px;border:none;border-radius:13px;cursor:pointer;color:#0a0e17;font-weight:900;font-size:15px;
  background:linear-gradient(90deg,#ff9a5a,#ff4f7f);box-shadow:0 8px 24px rgba(255,90,110,.4);transition:.25s}
.si-btn:hover,.mj-btn:hover{filter:brightness(1.08);transform:translateY(-2px)}
.si-btn.run,.mj-btn.run{background:linear-gradient(90deg,#39e6a0,#00e0ff);box-shadow:0 8px 24px rgba(57,230,160,.45);color:#0a0e17}
.si-warn,.mj-warn{margin-top:12px;font-size:11.5px;color:var(--txt-dim);line-height:1.6}

/* ============ 联系我们 · 号码卡 ============ */
.ct-nums{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:18px}
.ct-num{position:relative;display:flex;align-items:center;gap:14px;padding:16px 18px;border-radius:14px;
  background:linear-gradient(135deg,rgba(255,255,255,.055),rgba(255,255,255,.02));border:1px solid var(--glass-line);overflow:hidden}
.ct-num::after{content:"";position:absolute;right:-30px;top:-30px;width:110px;height:110px;border-radius:50%;
  background:radial-gradient(circle,rgba(0,224,255,.30),transparent 70%)}
.ct-num:nth-child(2)::after{background:radial-gradient(circle,rgba(57,230,160,.30),transparent 70%)}
.ct-num .ct-ic{font-size:30px;line-height:1;z-index:1}
.ct-info{flex:1;z-index:1}
.ct-info b{display:block;font-size:12px;letter-spacing:1px;color:var(--txt-dim);font-weight:600}
.ct-info strong{display:block;font-size:26px;font-weight:800;letter-spacing:2px;background:linear-gradient(90deg,#00e0ff,#7c5cff);
  -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;margin:2px 0 3px}
.ct-info span{font-size:11.5px;color:var(--txt-dim);line-height:1.4}
.ct-copy{align-self:stretch;z-index:1;border:1px solid rgba(0,224,255,.45);background:rgba(0,224,255,.10);color:#7ff6ff;
  border-radius:11px;padding:0 16px;font-size:13px;font-weight:700;cursor:pointer;transition:.25s}
.ct-copy:hover{background:rgba(0,224,255,.28);color:#fff;box-shadow:0 0 18px rgba(0,224,255,.35)}
.ct-copy.run{background:linear-gradient(90deg,#39e6a0,#00d2b8);color:#04241c;border-color:transparent}
.si-ta{resize:vertical;min-height:64px;line-height:1.55}
@media(max-width:640px){.ct-nums{grid-template-columns:1fr}}

/* ============ 今日校园 · 查寝价目 ============ */
.cq-price{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:18px 0 4px}
.cq-pbox{position:relative;padding:15px 12px;border-radius:14px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);text-align:center;transition:.28s;overflow:hidden}
.cq-pbox b{display:block;font-size:12px;color:var(--txt-dim);font-weight:700;letter-spacing:.5px}
.cq-pbox strong{display:block;font-size:28px;font-weight:900;color:#fff;margin:4px 0 2px;line-height:1.1}
.cq-pbox strong span{font-size:13px;font-weight:700;margin-left:3px;color:var(--txt-dim)}
.cq-pbox>span{font-size:11px;color:var(--txt-dim)}
.cq-pbox:hover{transform:translateY(-4px);border-color:rgba(255,140,100,.55);box-shadow:0 10px 26px rgba(255,100,90,.22)}
.cq-pbox.hot{border-color:rgba(255,120,90,.5);background:linear-gradient(160deg,rgba(255,120,90,.2),rgba(255,80,140,.1));box-shadow:0 8px 24px rgba(255,100,90,.2)}
.cq-pbox.hot::after{content:"最划算";position:absolute;top:8px;right:-1px;font-size:10px;font-weight:800;color:#3a1a00;
  background:linear-gradient(90deg,#ffcf3f,#ff9a3f);padding:2px 9px;border-radius:999px 0 0 999px}
@media(max-width:640px){.cq-price{grid-template-columns:1fr}}

/* ============ 论文指导 · 服务台 ============ */
.paper .pw-hero{background:linear-gradient(135deg,rgba(199,123,255,.16),rgba(255,106,129,.11) 58%,rgba(0,224,255,.09));border-color:rgba(199,123,255,.3)}
.paper .pw-hero .si-eyebrow,.paper .pw-eyebrow{color:#d9b4ff}
.paper .pw-txt h3{font-size:21px;margin:6px 0;background:linear-gradient(90deg,#d9b4ff,#ff9ad0,#ffb06b);-webkit-background-clip:text;background-clip:text;color:transparent}
.paper .pw-txt p{font-size:13px;color:var(--txt-dim);line-height:1.75}
.paper .pw-txt em{color:var(--gold);font-style:normal;font-weight:700}
.pw-sum{text-align:center;padding:10px 18px;border-radius:16px;background:rgba(0,0,0,.22);border:1px solid rgba(255,255,255,.1)}
.pw-sum b{display:block;font-size:30px;font-weight:900;color:#fff;line-height:1}.pw-sum span{font-size:11px;color:var(--txt-dim)}
.pw-chips{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px;margin:0 0 18px}
.pw-chip{position:relative;height:42px;border-radius:11px;cursor:pointer;border:1px solid rgba(255,255,255,.1);
  background:color-mix(in srgb,var(--c) 16%,rgba(255,255,255,.03));color:#fff;font-size:12.5px;font-weight:600;
  display:flex;align-items:center;justify-content:center;text-align:center;line-height:1.15;padding:0 5px;transition:.22s;overflow:hidden}
.pw-chip span{position:relative;z-index:1}
.pw-chip::before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 50% 120%,var(--c),transparent 70%);opacity:.5;transition:.22s}
.pw-chip:hover{transform:translateY(-3px);border-color:var(--c);box-shadow:0 8px 20px color-mix(in srgb,var(--c) 45%,transparent)}
.pw-chip.on{border-color:var(--c);box-shadow:0 0 0 2px var(--c),0 8px 22px color-mix(in srgb,var(--c) 50%,transparent);background:color-mix(in srgb,var(--c) 34%,rgba(255,255,255,.05))}
.pw-form{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:6px}
.pw-f{display:flex;flex-direction:column;gap:5px}.pw-f.wide{grid-column:1/-1}
.pw-f label{font-size:12.5px;color:var(--txt-dim)}
.pw-f label span{color:#ff7a8a;margin-left:2px}
.pw-in{width:100%;padding:11px 12px;border-radius:10px;border:1px solid rgba(255,255,255,.14);
  background:rgba(0,0,0,.24);color:#fff;font-size:13.5px;outline:none;transition:.22s}
.pw-in:focus{border-color:#c77bff;box-shadow:0 0 0 3px rgba(199,123,255,.24)}
.pw-btn{background:linear-gradient(90deg,#c77bff,#ff6b81);box-shadow:0 8px 24px rgba(199,123,255,.42)}
.pw-btn.run{background:linear-gradient(90deg,#39e6a0,#00e0ff);box-shadow:0 8px 24px rgba(57,230,160,.45)}
@media(max-width:640px){.pw-form{grid-template-columns:1fr}}

/* ============ 实习GZ · 专业大全 ============ */
.major .mj-hero{background:linear-gradient(135deg,rgba(124,92,255,.16),rgba(0,224,255,.10) 55%,rgba(255,92,174,.12));border-color:rgba(124,92,255,.28)}
.major .mj-hero .si-eyebrow,.major .mj-eyebrow{color:#b9a6ff}
.major .mj-txt h3{font-size:21px;margin:6px 0;background:linear-gradient(90deg,#a98bff,#00e0ff,#ff9ad0);-webkit-background-clip:text;background-clip:text;color:transparent}
.major .mj-txt p{font-size:13px;color:var(--txt-dim);line-height:1.75}
.major .mj-txt em{color:var(--gold);font-style:normal;font-weight:700}
.mj-sum{text-align:center;padding:10px 18px;border-radius:16px;background:rgba(0,0,0,.22);border:1px solid rgba(255,255,255,.1)}
.mj-sum b{display:block;font-size:30px;font-weight:900;color:#fff;line-height:1}.mj-sum span{font-size:11px;color:var(--txt-dim)}
.mj-form{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:4px 0 18px}
.mj-f{display:flex;flex-direction:column;gap:5px}.mj-f.wide{grid-column:1/-1}
.mj-f label{font-size:12.5px;color:var(--txt-dim)}
.mj-f label span{color:#ff7a8a;margin-left:2px}
.mj-f label small{color:var(--gold);font-size:11px;margin-left:6px}
.mj-f .mj-in:focus{border-color:#8b7bff;box-shadow:0 0 0 3px rgba(139,123,255,.22)}
.mj-wallhead{display:flex;align-items:center;justify-content:space-between;margin:2px 0 10px;font-size:12.5px;color:var(--txt-dim)}
.mj-wallhead em{color:var(--gold);font-style:normal;font-weight:700}
.mj-wall{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:9px;margin-bottom:18px}
.mj-chip{position:relative;height:46px;border-radius:12px;cursor:pointer;border:1px solid rgba(255,255,255,.1);
  background:color-mix(in srgb,var(--c) 16%,rgba(255,255,255,.03));color:#fff;font-size:13px;font-weight:600;
  display:flex;align-items:center;justify-content:center;text-align:center;line-height:1.15;padding:0 6px;transition:.22s;overflow:hidden}
.mj-chip span{position:relative;z-index:1}
.mj-chip::before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 50% 120%,var(--c),transparent 70%);opacity:.5;transition:.22s}
.mj-chip:hover{transform:translateY(-3px);border-color:var(--c);box-shadow:0 8px 20px color-mix(in srgb,var(--c) 45%,transparent)}
.mj-chip.on{border-color:var(--c);box-shadow:0 0 0 2px var(--c),0 8px 22px color-mix(in srgb,var(--c) 50%,transparent);background:color-mix(in srgb,var(--c) 32%,rgba(255,255,255,.05))}
.mj-btn{background:linear-gradient(90deg,#a98bff,#00e0ff);box-shadow:0 8px 24px rgba(124,92,255,.42)}
.mj-meta b{color:#a98bff}
@media(max-width:640px){.mj-form{grid-template-columns:1fr}.mj-chip{height:42px;font-size:12.5px}}

.toast{position:fixed;left:50%;bottom:36px;transform:translateX(-50%) translateY(20px);opacity:0;pointer-events:none;
  padding:12px 22px;border-radius:999px;background:rgba(20,22,50,.92);border:1px solid var(--glass-line);
  backdrop-filter:blur(12px);font-size:13.5px;transition:.3s;z-index:99}.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}

footer{max-width:1440px;margin:0 auto;padding:26px 28px 40px;color:var(--txt-dim);font-size:12.5px;
  border-top:1px solid var(--glass-line);display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
footer a{color:var(--accent);text-decoration:none}
footer a:hover{text-decoration:underline}
@media(max-width:640px){
  .hwrap{padding:14px 16px 0}.brand h1{font-size:15px}main{padding:20px 16px 60px}
  .hero h2{font-size:21px}.grid{grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:11px}
  .si-grid{grid-template-columns:1fr}footer{padding:20px 16px 30px}
}
</style>
</head>
<body>
<div class="aurora"><i></i><i></i><i></i><i></i></div>
<div class="grid-bg"></div>

<header>
  <div class="hwrap">
    <div class="brandrow">

function colorOf(tag,seed){
  const arr=PALETTE[tag]||PALETTE["更多"];
  return arr[Math.abs(hash(seed))%arr.length];
}
function hash(s){let h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619);}return h>>>0;}
function abbr(nm){return (nm.replace(/[·（）()【】\s]/g,"").slice(0,2))||"·";}

/* ================= 状态 ================= */
const CATS=["实习DK平台","实用软件","学习通课程","今日校园","论文指导","网课","实习GZ","请假条","联系我们"];
const ICONS=["🎓","💻","📚","🏫","📄","🎥","🧳","📝","📞"];
const STORE="campus_hub_v1";
const SESS={};
let state={cat:CATS[0],order:{},view:"all"};
CATS.forEach(c=>{if(!state.order[c])state.order[c]=DATA[c].map((_,i)=>i);});
try{const s=JSON.parse(localStorage.getItem(STORE));if(s&&s.order)state.order={...state.order,...s.order};}catch(e){}


const $$=sel=>document.querySelectorAll(sel);
function save(){try{localStorage.setItem(STORE,JSON.stringify({order:state.order}));}catch(e){}}
function toast(m){const t=document.querySelector("#toast");t.textContent=m;t.classList.add("on");clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove("on"),1600);}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));}

function renderNav(){
  const nav=document.querySelector("#nav");nav.innerHTML="";
  CATS.forEach((c,i)=>{
    const b=document.createElement("button");
    b.innerHTML=`${ICONS[i]} ${c}<span class="n">${DATA[c].length||""}</span>`;
    if(c==="学习通课程"||c==="今日校园")b.querySelector(".n").style.display="none";
    b.className= state.cat===c?"on":"";
    b.onclick=()=>{state.cat=c;render();window.scrollTo({top:0,behavior:"smooth"});};
    nav.appendChild(b);

/* ================= 卡片 ================= */
function cardEl(nm,tag,key){
  const el=document.createElement("div");el.className="card";el.style.setProperty("--c",colorOf(tag,key));
  el.innerHTML=`<div class="av">${esc(abbr(nm))}</div><div class="nm"></div><div class="tg">${esc(tag)}</div>`;
  el.querySelector(".nm").innerHTML=esc(nm);
  el.onclick=()=>toast("示例入口："+nm+"（把 url 填进 DATA 即可跳转）");
  el.draggable=state.view==="sort";
  el.ondragstart=e=>{e.dataTransfer.setData("text/plain",key);el.style.opacity=.4;};
  el.ondragend=()=>{el.style.opacity="";};
  el.ondragover=e=>{e.preventDefault();};
  el.ondrop=e=>{e.preventDefault();
    const from=state.order[state.cat].indexOf(key);
    const to=state.order[state.cat].indexOf(el.dataset.key??key);
    const arr=state.order[state.cat];
    arr.splice(from,1);arr.splice(to,0,key);save();render();
  };
  el.dataset.key=key;
  return el;
}

/* 拖拽排序（网格版） */
let dragKey=null;
function enableSort(grid){
  grid.querySelectorAll(".card").forEach(c=>{
    c.draggable=true;
    c.ondragstart=()=>{dragKey=c.dataset.key;c.style.opacity=.4;};
    c.ondragend=()=>{c.style.opacity="";dragKey=null;};
    c.ondragover=e=>e.preventDefault();
    c.ondrop=e=>{e.preventDefault();
      if(!dragKey||dragKey===c.dataset.key)return;
      const arr=state.order[state.cat];
      const a=arr.indexOf(dragKey),b=arr.indexOf(c.dataset.key);
      arr.splice(a,1);arr.splice(b,0,dragKey);save();render();
    };
  });
}

function addEntry(){
  const nm=prompt("入口名称？");if(!nm||!nm.trim())return;
  const tg=prompt("标签（实习/院校/网课/查寝/签到/请假/联系…）","实习");if(tg===null)return;
  DATA[state.cat].push([nm.trim(),tg.trim(),Date.now()+""]);
  state.order[state.cat]=DATA[state.cat].map((_,i)=>i);
  save();render();toast("已添加："+nm.trim());
}

      </div>

    </div>`;

  const KEY="signin_xtkc_";
  const ins={};
  wrap.querySelectorAll(".si-in").forEach(inp=>{
    const f=inp.dataset.f;ins[f]=inp;
    inp.value=sessionStorage.getItem(KEY+f)||"";
    inp.addEventListener("input",()=>sessionStorage.setItem(KEY+f,inp.value));
  });
  const up=wrap.querySelector(".si-up"),file=up.querySelector("input");
  let photoOk=false;
  function load(f){if(!f)return;if(f.size>10*1024*1024){toast("照片超过 10MB 啦");return;}
    const r=new FileReader();
    r.onload=()=>{photoOk=true;up.classList.add("ok");up.querySelector("b").textContent=f.name;
      up.querySelector("small").textContent=(f.size/1024/1024).toFixed(2)+" MB · 已就绪";
      sessionStorage.setItem(KEY+"照片",r.target.result);};
    r.readAsDataURL(f);};
  file.addEventListener("change",e=>load(e.target.files[0]));
  up.addEventListener("dragover",e=>{e.preventDefault();up.style.borderColor="var(--accent)";});
  up.addEventListener("drop",e=>{e.preventDefault();load(e.dataTransfer.files[0]);});

  const btn=wrap.querySelector("#siBtn"),st=wrap.querySelector("#siState");
  btn.addEventListener("click",async()=>{
    const miss=SIGNTASK.filter(f=>{
      if(f==="照片")return !photoOk;
      return !ins[f].value.trim();
    });
    if(miss.length){
      st.textContent="缺："+miss.join("、");st.style.color="var(--accent3)";
      btn.querySelector("span").textContent="⚠️ 信息不全，再检查一下";return;
    }
    const txt=`【学习通签到任务单】
课程名字：${ins["课程名字"].value.trim()}
账号：${ins["账号"].value.trim()}
密码：${ins["密码"].value.trim()}
时间：${ins["时间"].value.trim()}
地址：${ins["地址"].value.trim()}
照片：已附（${up.querySelector("b").textContent}）
签到方式：照片 / 人脸 / 位置 / 手势 / 扫码 / 数字 / 群签到`;
    st.textContent="已复制到剪贴板";st.style.color="var(--accent4)";
    btn.classList.add("run");btn.querySelector("span").textContent="✅ 已复制，去微信粘贴吧～";
    try{await navigator.clipboard.writeText(txt);}catch(e){prompt("自动复制被拦了，手动全选复制：",txt);}
    setTimeout(()=>{btn.classList.remove("run");btn.querySelector("span").textContent="📋 一键复制任务单";},2200);
  });
  return wrap;
}

    </div>`;

  const g=id=>wrap.querySelector("#"+id);
  PAPER_SERV.forEach(([,key])=>{
    const el=g(key); if(!el) return;
    el.value=sessionStorage.getItem(PAPER_KEY+key)||"";
    el.addEventListener("input",()=>sessionStorage.setItem(PAPER_KEY+key,el.value));
  });
  const svcIn=g("lw_svc"),chips=wrap.querySelector("#pwChips"),pick=wrap.querySelector("#pwState"),btn=g("pwBtn");
  chips.querySelectorAll(".pw-chip").forEach(b=>{
    b.onclick=()=>{
      svcIn.value=b.dataset.m;
      sessionStorage.setItem(PAPER_KEY+"lw_svc",b.dataset.m);
      chips.querySelectorAll(".pw-chip").forEach(x=>x.classList.remove("on"));
      b.classList.add("on");
      pick.textContent="已选："+b.dataset.m;
    };
  });

  btn.onclick=async()=>{
    const v=k=>g(k).value.trim();
    const must=["lw_svc","lw_major","lw_words","lw_check","lw_deadline"].map(k=>[k,v(k)]);
    const miss=must.filter(([,x])=>!x).map(([k])=>PAPER_SERV.find(([,kk])=>kk===k)[0]);
    if(miss.length){pick.textContent="还缺："+miss.join("、");pick.style.color="var(--accent3)";
      btn.querySelector("span").textContent="⚠️ 必填项再检查一下";return;}
    const note=v("lw_note"),title=v("lw_title");
    const txt="【论文指导 · 需求单】\n"
      +"学校专业："+v("lw_major")+"\n"
      +(title?("论文题目："+title+"\n"):"")
      +"字数要求："+v("lw_words")+"\n"
      +"查重要求："+v("lw_check")+"\n"
      +"截止时间："+v("lw_deadline")+"\n"
      +(note?("补充说明："+note+"\n"):"")
      +"👉 麻烦先按我的截止时间报个周期和费用，合适我就定，谢谢！";
    pick.textContent="已复制到剪贴板";pick.style.color="var(--accent4)";
    btn.classList.add("run");btn.querySelector("span").textContent="✅ 已复制，去微信发给客服吧～";
    try{await navigator.clipboard.writeText(txt);}catch(e){prompt("自动复制被拦了，手动全选复制：",txt);}
    setTimeout(()=>{btn.classList.remove("run");btn.querySelector("span").textContent="📋 一键复制需求单";},2200);
  };
  return wrap;
}

/* ================= 实习GZ · 专业大全 ================= */
const MAJOR_KEY="major_gz_";

  return pal[(i*7+Math.floor(nm.length*3))%pal.length];
}

      </div>
      <p class="mj-warn">🔒 只在本机浏览器暂存，不上传学校、专业或任何联系方式。实习安排请自行核实单位资质与学校要求；上方专业清单为检索目录，具体岗位以实际供需为准。</p>
    </div>`;

  const g=id=>wrap.querySelector("#"+id);
  ["mjMajor","mjSchool","mjCity","mjNote"].forEach(id=>{

  wall.querySelectorAll(".mj-chip").forEach(b=>{

      mjIn.value=b.dataset.m.replace(/&(?:amp|lt|gt|quot);/g,c=>({"&amp;":"&","&lt;":"<","&gt;":">","&quot;":'"'}[c]));
      sessionStorage.setItem(MAJOR_KEY+"mjMajor",mjIn.value);

  return wrap;
}

/* ================= 联系我们 · 客服直达 ================= */
const QQ_NUM="360350094";
const CT_KEY="ct_";
function buildContact(){
  const wrap=document.createElement("div");wrap.className="signin";
  wrap.innerHTML=`
    <div class="si-hero">
      <div class="si-halo" style="background:radial-gradient(circle at 30% 20%,rgba(0,224,255,.5),transparent 60%),radial-gradient(circle at 80% 70%,rgba(124,92,255,.5),transparent 60%)"></div>
      <div class="si-txt">
        <span class="si-eyebrow">📞 更多问题咨询 · 联系我们</span>
        <h3>有啥问题，直接戳我</h3>
        <p>填一句你想问的，点复制后<b>加 QQ 或绿泡泡</b>发过去，我这边看到就回。</p>
      </div>
      <div class="si-chips cq-c"><span>💬 QQ 同号</span><span>🟢 绿泡泡同号</span><span>⚡ 看到就回</span></div>
    </div>

    <div class="si-card">
      <div class="si-bar"><i></i><i></i><i></i><b>联系方式</b><em id="ctState">待发送</em></div>

      <div class="ct-nums">
        <div class="ct-num" id="ctQQ">
          <span class="ct-ic">🐧</span>
          <div class="ct-info">
            <b>QQ 号</b>
            <strong>${QQ_NUM}</strong>
            <span>复制后打开 QQ → 加好友 → 粘贴问题</span>
          </div>
          <button class="ct-copy" data-n="${QQ_NUM}" data-l="QQ"><span>复制 QQ</span></button>
        </div>
        <div class="ct-num" id="ctWx">
          <span class="ct-ic">💚</span>
          <div class="ct-info">
            <b>绿泡泡（微信）</b>
            <strong>${QQ_NUM}</strong>
            <span>和 QQ 同一个号，不用再记一遍</span>
          </div>
          <button class="ct-copy" data-n="${QQ_NUM}" data-l="绿泡泡"><span>复制绿泡泡</span></button>
        </div>
      </div>

      <div class="si-grid">
        <div class="si-f wide">
          <label>想问点啥<span>*</span></label>
          <textarea class="si-in si-ta" id="ctMsg" placeholder="例：学习通人脸签到怎么弄？/ 实习盖章能安排成都的公司吗？/ 论文查重能降到 10% 以内不？" rows="3">${sessionStorage.getItem(CT_KEY+"msg")||""}</textarea>

      <div class="si-foot">
        <span class="si-meta"><b>小提示</b>QQ / 绿泡泡都是 <b>${QQ_NUM}</b>，复制号码再加好友更快</span>

  const ta=wrap.querySelector("#ctMsg");
  ta.addEventListener("input",()=>sessionStorage.setItem(CT_KEY+"msg",ta.value));

  wrap.querySelectorAll(".ct-copy").forEach(b=>{
    b.addEventListener("click",async()=>{

/* ================= 渲染 ================= */
function render(){
  renderNav();
  const main=document.querySelector("#main");main.innerHTML="";
  const data=DATA[state.cat];
  const order=state.order[state.cat]||data.map((_,i)=>i);

  const panel=document.createElement("section");panel.className="panel";
  const hero=document.createElement("div");hero.className="hero";
  hero.innerHTML=`<div><h2>${ICONS[CATS.indexOf(state.cat)]} ${state.cat}<em id="subTitle"></em></h2><p id="desc"></p></div>`;
  panel.appendChild(hero);

  const tools=document.createElement("div");tools.className="tools";
  tools.innerHTML=`
    <div class="act">
      <button data-v="all" class="${state.view==='all'?'on':''}">全部</button>
      <button data-v="sort" class="${state.view==='sort'?'on':''}">✋ 排序模式</button>
      <button id="addBtn">＋ 添加入口</button>
    </div>`;
  panel.appendChild(tools);
  main.appendChild(panel);

  const grid=document.createElement("div");grid.className="grid";grid.id="grid";

  /* ---- 三个专用页面 ---- */
  if(state.cat==="学习通课程"){panel.appendChild(buildSignIn());main.appendChild(panel);bindTools();return;}
  if(state.cat==="今日校园"){panel.appendChild(buildCqForm());main.appendChild(panel);bindTools();return;}
  if(state.cat==="论文指导"){panel.appendChild(buildPaperWall());main.appendChild(panel);bindTools();return;}
  if(state.cat==="实习GZ"){panel.appendChild(buildMajorWall());main.appendChild(panel);bindTools();return;}
  if(state.cat==="联系我们"){panel.appendChild(buildContact());main.appendChild(panel);bindTools();return;}

  /* ---- 普通卡片墙 ---- */
  const list=order.map(i=>data[i]).filter(Boolean);
  list.forEach(([nm,tag,key])=>grid.appendChild(cardEl(nm,tag,key)));
  panel.appendChild(grid);
  if(state.view==="sort")enableSort(grid);

  const descMap={
    "实习DK平台":`共 ${data.length} 个实习 / 实践 / 签到平台，重复项已保留原样。支持拖拽排位，常用的一律放最前。`,
    "实用软件":"装机 & 学习刚需，浏览器 / 网盘 / 文献 / 录屏一条龙。",
    "学习通课程":"<b>学习通课程签到方式目前有：照片、人脸、位置、手势，扫码、数字、群签到等等多种签到完事，都可以完美解决。</b>",
    "今日校园":"<b>查寝代打卡：</b>填好查寝软件 / 学校 / 打卡账号 / 打卡密码 / 打卡地址 / 签到时间，一键复制发我。<b>单次 10 元，包 8 次以上 5 元/次，可包月 100 元。</b>",
    "论文指导":"<b>论文指导一条龙：</b>专科本科硕士、开题到答辩、查重降重到格式排版，选好服务类型填需求单，<em>一键复制发客服</em>。具体周期、字数与费用按你的截止时间单独报，先问再定更稳。",
    "网课":"直播、回放、倍速、自动签到，网课人的兵器库。",
    "实习GZ":`<b>实习生专业大全（${data.length} 个方向）</b>：报自己的专业 + 学校 + 想在哪里的公司，客服给你匹配对口单位。<em>别选和学校同市的，避免回访穿帮。</em> 填完一键复制发客服。`,
    "请假条":"事假病假公假、审批进度、销假导出，模板都备好了。",
    "联系我们":"<b>更多问题咨询，联系我们 → QQ：${QQ_NUM}　绿泡泡：${QQ_NUM}</b>（QQ、微信同一个号）。把想问的写一句，点一下就能连号码带问题一起复制走，看到就回。"
  };
  document.querySelector("#desc").innerHTML=descMap[state.cat]||"";
  document.querySelector("#subTitle").textContent=` · ${data.length} 个入口`;
  bindTools();
}

function bindTools(){
  document.querySelectorAll(".act button[data-v]").forEach(b=>b.onclick=()=>{state.view=b.dataset.v;render();});
  const ad=document.querySelector("#addBtn");if(ad)ad.onclick=addEntry;
}

/* ================= 启动 ================= */
document.querySelector("#yr").textContent=new Date().getFullYear();
function clock(){const d=new Date();document.querySelector("#clock").textContent=d.toLocaleTimeString("zh-CN",{hour12:false});}
clock();setInterval(clock,1000);
document.querySelector("#resetBtn").onclick=e=>{e.preventDefault();
  if(confirm("恢复全部类目的默认排序？")){
    const n={};CATS.forEach(c=>n[c]=DATA[c].map((_,i)=>i));
    state.order=n;save();render();toast("已恢复默认排序");
  }
};
render();
</script>
